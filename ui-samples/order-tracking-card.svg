<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Card -->
  <rect x="24" y="24" width="752" height="552" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Header -->
  <text x="48" y="64" font-family="system-ui" font-size="20" font-weight="600" fill="#111827">Order #ORD-2024-001</text>
  <rect x="650" y="44" width="100" height="28" rx="4" fill="#dbeafe"/>
  <text x="700" y="62" font-family="system-ui" font-size="12" fill="#1e40af" text-anchor="middle">Processing</text>
  
  <!-- Product Info -->
  <rect x="48" y="88" width="120" height="120" rx="8" fill="#f3f4f6"/>
  <text x="108" y="150" font-family="system-ui" font-size="40" fill="#9ca3af" text-anchor="middle">📷</text>
  <text x="184" y="108" font-family="system-ui" font-size="16" font-weight="600" fill="#111827">Vintage Camera - Canon AE-1</text>
  <text x="184" y="132" font-family="system-ui" font-size="13" fill="#6b7280">Mercari • Used condition</text>
  <text x="184" y="156" font-family="system-ui" font-size="14" fill="#6b7280">Quantity: 1</text>
  <text x="184" y="180" font-family="system-ui" font-size="18" font-weight="700" fill="#111827">¥12,500</text>
  <text x="184" y="200" font-family="system-ui" font-size="13" fill="#6b7280">₩115,000 KRW</text>
  
  <!-- Timeline -->
  <text x="48" y="260" font-family="system-ui" font-size="16" font-weight="600" fill="#111827">Order Timeline</text>
  
  <!-- Timeline Step 1 - Completed -->
  <circle cx="64" cy="300" r="12" fill="#10b981"/>
  <text x="64" y="306" font-family="system-ui" font-size="12" fill="#ffffff" text-anchor="middle">✓</text>
  <line x1="64" y1="312" x2="64" y2="340" stroke="#10b981" stroke-width="2"/>
  <text x="88" y="304" font-family="system-ui" font-size="14" font-weight="600" fill="#111827">Request Submitted</text>
  <text x="88" y="322" font-family="system-ui" font-size="12" fill="#6b7280">Jan 15, 2024 at 10:30 AM</text>
  
  <!-- Timeline Step 2 - Completed -->
  <circle cx="64" cy="340" r="12" fill="#10b981"/>
  <text x="64" y="346" font-family="system-ui" font-size="12" fill="#ffffff" text-anchor="middle">✓</text>
  <line x1="64" y1="352" x2="64" y2="380" stroke="#10b981" stroke-width="2"/>
  <text x="88" y="344" font-family="system-ui" font-size="14" font-weight="600" fill="#111827">Order Confirmed</text>
  <text x="88" y="362" font-family="system-ui" font-size="12" fill="#6b7280">Jan 15, 2024 at 11:15 AM</text>
  
  <!-- Timeline Step 3 - Active -->
  <circle cx="64" cy="380" r="12" fill="#3b82f6"/>
  <circle cx="64" cy="380" r="8" fill="#ffffff"/>
  <line x1="64" y1="392" x2="64" y2="420" stroke="#d1d5db" stroke-width="2"/>
  <text x="88" y="384" font-family="system-ui" font-size="14" font-weight="600" fill="#111827">Processing Purchase</text>
  <text x="88" y="402" font-family="system-ui" font-size="12" fill="#6b7280">In progress...</text>
  
  <!-- Timeline Step 4 - Pending -->
  <circle cx="64" cy="420" r="12" fill="#e5e7eb"/>
  <line x1="64" y1="432" x2="64" y2="460" stroke="#d1d5db" stroke-width="2"/>
  <text x="88" y="424" font-family="system-ui" font-size="14" fill="#9ca3af">Purchased</text>
  <text x="88" y="442" font-family="system-ui" font-size="12" fill="#9ca3af">Pending</text>
  
  <!-- Timeline Step 5 - Pending -->
  <circle cx="64" cy="460" r="12" fill="#e5e7eb"/>
  <line x1="64" y1="472" x2="64" y2="500" stroke="#d1d5db" stroke-width="2"/>
  <text x="88" y="464" font-family="system-ui" font-size="14" fill="#9ca3af">Shipped</text>
  <text x="88" y="482" font-family="system-ui" font-size="12" fill="#9ca3af">Pending</text>
  
  <!-- Timeline Step 6 - Pending -->
  <circle cx="64" cy="500" r="12" fill="#e5e7eb"/>
  <text x="88" y="504" font-family="system-ui" font-size="14" fill="#9ca3af">Delivered</text>
  <text x="88" y="522" font-family="system-ui" font-size="12" fill="#9ca3af">Pending</text>
  
  <!-- Cost Breakdown -->
  <rect x="400" y="280" width="360" height="240" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="416" y="308" font-family="system-ui" font-size="16" font-weight="600" fill="#111827">Cost Breakdown</text>
  
  <text x="416" y="340" font-family="system-ui" font-size="13" fill="#6b7280">Product Price:</text>
  <text x="720" y="340" font-family="system-ui" font-size="13" fill="#111827" text-anchor="end">¥12,500</text>
  
  <text x="416" y="364" font-family="system-ui" font-size="13" fill="#6b7280">Service Fee (5%):</text>
  <text x="720" y="364" font-family="system-ui" font-size="13" fill="#111827" text-anchor="end">¥625</text>
  
  <text x="416" y="388" font-family="system-ui" font-size="13" fill="#6b7280">Domestic Shipping:</text>
  <text x="720" y="388" font-family="system-ui" font-size="13" fill="#111827" text-anchor="end">¥500</text>
  
  <text x="416" y="412" font-family="system-ui" font-size="13" fill="#6b7280">International Shipping:</text>
  <text x="720" y="412" font-family="system-ui" font-size="13" fill="#111827" text-anchor="end">¥1,500</text>
  
  <line x1="416" y1="428" x2="720" y2="428" stroke="#e5e7eb" stroke-width="1"/>
  
  <text x="416" y="452" font-family="system-ui" font-size="16" font-weight="600" fill="#111827">Total:</text>
  <text x="720" y="452" font-family="system-ui" font-size="18" font-weight="700" fill="#111827" text-anchor="end">¥15,125</text>
  <text x="720" y="472" font-family="system-ui" font-size="13" fill="#6b7280" text-anchor="end">₩139,250</text>
  
  <!-- Action Buttons -->
  <rect x="400" y="540" width="160" height="40" rx="6" fill="#f3f4f6"/>
  <text x="480" y="565" font-family="system-ui" font-size="14" fill="#374151" text-anchor="middle">Contact Support</text>
  <rect x="580" y="540" width="160" height="40" rx="6" fill="#3b82f6"/>
  <text x="660" y="565" font-family="system-ui" font-size="14" fill="#ffffff" text-anchor="middle">View Details</text>
</svg>

